<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gunnabot transcripts</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2a2e37; --text: #e6e8ec; --dim: #8b93a1;
    --accent: #7cc4ff; --fixed: #f0b354; --ok: #6fcf8e; --junk: #7a7f8a; --bad: #ff7b72; --flag: #f58fb5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 600; }
  select, input[type=search] { background: var(--bg); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 8px; font: inherit; }
  #session { max-width: 420px; }
  input[type=search] { width: 190px; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  label input { accent-color: var(--accent); }
  #count { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  #bar { height: 3px; background: var(--line); }
  #bar div { height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  main { flex: 1; overflow-y: auto; padding: 8px 0 40vh; }
  #empty { color: var(--dim); padding: 40px 16px; text-align: center; }
  .row { display: grid; grid-template-columns: 70px 120px 1fr 190px 150px; gap: 10px; align-items: start;
         padding: 3px 16px; border-left: 3px solid transparent; }
  .row:hover { background: #191c21; }
  .row.current { background: #20242c; border-left-color: var(--accent); }
  .row.fixed { border-left-color: var(--fixed); }
  .row.ok { border-left-color: var(--ok); }
  .row.junk { border-left-color: var(--junk); }
  .row.junk textarea { color: var(--junk); text-decoration: line-through; }
  .row.dirty textarea { border-color: var(--fixed); }
  .time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 6px; }
  .who { font-weight: 600; padding-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  textarea { width: 100%; background: transparent; color: var(--text); border: 1px solid transparent;
             border-radius: 6px; padding: 4px 8px; font: inherit; resize: none; overflow: hidden; display: block; }
  .row:hover textarea { border-color: var(--line); }
  textarea:focus { outline: none; border-color: var(--accent) !important; background: var(--bg); }
  .was { color: var(--dim); font-size: 13px; padding: 0 9px 3px; }
  .was:empty { display: none; }
  .ref { color: var(--dim); font-size: 13px; padding: 0 9px 3px; display: flex; gap: 8px; align-items: baseline; }
  .ref b { color: var(--flag); font-weight: 600; white-space: nowrap; }
  .ref span { color: var(--text); opacity: .85; }
  .ref mark { background: #f58fb533; color: #ffc4dc; border-radius: 3px; padding: 0 2px; }
  .ref button { font-size: 12px; padding: 0 7px; white-space: nowrap; }
  .row.likely .time::before, .row.unsure .time::before { content: "●"; color: var(--flag); margin-right: 4px; font-size: 10px; vertical-align: 2px; }
  .row.unsure .time::before { content: "○"; }
  .row.unsure .ref b { color: var(--dim); }
  .row.fixed .time::before, .row.ok .time::before, .row.junk .time::before { opacity: .35; }
  .was s { color: var(--bad); text-decoration-color: #ff7b7266; }
  .tags { display: flex; gap: 6px; padding-top: 6px; font-size: 12px; color: var(--dim); white-space: nowrap;
          justify-content: flex-end; overflow: hidden; }
  .tag { border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; overflow: hidden; text-overflow: ellipsis; }
  .tag.cmd { color: var(--accent); border-color: #7cc4ff55; }
  .acts { display: flex; gap: 4px; padding-top: 3px; justify-content: flex-end; }
  button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 6px;
           font: inherit; font-size: 13px; padding: 2px 8px; cursor: pointer; }
  button:hover { color: var(--text); border-color: var(--dim); }
  .undo { visibility: hidden; }
  .row.fixed .undo, .row.ok .undo, .row.junk .undo { visibility: visible; }
  .row.bot { color: var(--dim); font-style: italic; }
  .row.bot .who { font-weight: 400; }
  .row.bot .said { padding: 5px 9px; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 7px 16px; color: var(--dim);
           font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  kbd { background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
        padding: 0 5px; font: 12px ui-monospace, Consolas, monospace; color: var(--text); }
  #toast { position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #111;
           padding: 8px 14px; border-radius: 8px; display: none; font-weight: 600; }
  .save { display: none; }
  @media (max-width: 900px) { .row { grid-template-columns: 60px 90px 1fr 150px; } .tags { display: none; } }
  /* phones: the page scrolls as a whole so the controls go out of the way, each line is stacked, and
     there are buttons for what a keyboard does on a computer */
  @media (max-width: 700px) {
    html, body { height: auto; }
    body { display: block; font-size: 16px; }
    main { overflow: visible; padding-bottom: 50vh; }
    header { padding: 8px 10px; gap: 8px; }
    header h1, footer { display: none; }
    select, input[type=search], textarea { font-size: 16px; }   /* smaller makes iOS zoom in on focus */
    #session { max-width: none; width: 100%; }
    #speaker, #show { flex: 1 1 40%; min-width: 0; }
    input[type=search] { flex: 1 1 45%; width: auto; min-width: 0; }
    #count { margin-left: 0; width: 100%; font-size: 13px; }
    .row { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "time who acts" "said said said";
           gap: 4px 8px; padding: 8px 10px 10px; border-bottom: 1px solid var(--line); }
    .row:hover { background: none; }
    .row.current { background: #20242c; }
    .time { grid-area: time; padding-top: 9px; }
    .who { grid-area: who; padding-top: 8px; }
    .said { grid-area: said; }
    .acts { grid-area: acts; padding-top: 0; }
    .row.bot { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "time who" "said said"; }
    .row.bot > span:empty { display: none; }
    .row.bot .said { padding: 0 2px; }
    textarea, .row:hover textarea { border-color: var(--line); padding: 7px 9px; }
    .was, .ref { padding: 4px 2px 0; }
    .ref { flex-wrap: wrap; row-gap: 2px; }
    .ref button { min-height: 32px; padding: 0 12px; margin-left: auto; }
    button { min-height: 38px; min-width: 42px; font-size: 14px; }
    .save { display: inline-block; color: var(--ok); border-color: #6fcf8e66; }
    .undo { display: none; }
    .row.fixed .undo, .row.ok .undo, .row.junk .undo { display: inline-block; }
    #toast { bottom: 16px; max-width: 92vw; }
  }
</style>
</head>
<body>
<header>
  <h1>Gunnabot transcripts</h1>
  <select id="session" title="Voice session"></select>
  <select id="speaker" title="Who spoke"></select>
  <select id="show" title="Which lines">
    <option value="all">All lines</option>
    <option value="likely">Likely errors to review</option>
    <option value="flag">All disagreements to review</option>
    <option value="todo">Not reviewed</option>
    <option value="done">Reviewed</option>
    <option value="fixed">Fixed</option>
  </select>
  <label title="Lines that named the bot or that it acted on"><input type="checkbox" id="forbot"> To the bot</label>
  <input type="search" id="search" placeholder="Find words">
  <label><input type="checkbox" id="autoplay" checked> Play on focus</label>
  <select id="order" title="Order of the lines">
    <option value="old">Oldest first</option><option value="new">Newest first</option>
  </select>
  <select id="speed" title="Playback speed">
    <option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="0.75">0.75×</option>
  </select>
  <span id="count"></span>
</header>
<div id="bar"><div></div></div>
<main id="list"><div id="empty">Loading…</div></main>
<footer>
  <span><kbd>Enter</kbd> save and next (unchanged = heard right)</span>
  <span><kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> move without marking</span>
  <span><kbd>Ctrl</kbd>+<kbd>Space</kbd> play again</span>
  <span><kbd>Alt</kbd>+<kbd>U</kbd> use the cloud's version</span>
  <span><kbd>Alt</kbd>+<kbd>J</kbd> junk: noise, crosstalk, can't tell</span>
  <span><kbd>Esc</kbd> put the text back</span>
</footer>
<div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const list = $("list"), audio = new Audio();
const COLOURS = ["#7cc4ff", "#f0b354", "#6fcf8e", "#e39cf5", "#ff9d8a", "#8fe0d6", "#d6d36a", "#a9b4ff", "#f58fb5"];
const CHUNK = 150;
let S = null;          // the open session: {id, lines, corrections}
let view = [];         // indexes into S.lines of the rows to show
let drawn = 0;         // how many of view are in the page
let colour = {};
// settings kept in the browser; private windows and embedded pages may refuse, which only means they aren't kept
const prefs = (() => { try { return JSON.parse(localStorage.getItem("transcripts") || "{}"); } catch { return {}; } })();

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const plain = s => s.toLowerCase().replace(/['\u2019]/g, "").replace(/[^a-z0-9]+/g, " ").split(" ").filter(Boolean);
const tidy = s => s.split(/\s+/).filter(Boolean).join(" ");
const fit = t => { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; };

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 5000);
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function savePrefs() {
  Object.assign(prefs, { show: $("show").value, forbot: $("forbot").checked, order: $("order").value, autoplay: $("autoplay").checked, speed: $("speed").value });
  try { localStorage.setItem("transcripts", JSON.stringify(prefs)); } catch {}
}

// ---- sessions ----
async function loadSessions() {
  const all = await api("/api/sessions");
  const sel = $("session"); sel.replaceChildren();
  if (!all.length) { $("empty").textContent = "No recorded sessions yet. They appear here once ?chat has been used."; return; }
  for (const s of all) {
    const when = s.started ? new Date(s.started).toLocaleString("en-NZ", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : s.id;
    const o = el("option", "", `${when} · ${s.channel || s.guild} · ${s.reviewed}/${s.clips}`); o.value = s.id; sel.append(o);
  }
  const want = decodeURIComponent(location.hash.slice(1));
  sel.value = all.some(s => s.id === want) ? want : all[0].id;
  await openSession(sel.value);
}
async function openSession(id) {
  list.replaceChildren(el("div", "", "")); list.firstChild.id = "empty"; list.firstChild.textContent = "Loading…";
  S = await api("/api/session/" + encodeURIComponent(id));
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  const people = new Map();
  for (const l of S.lines) if (!l.bot) people.set(l.user_id, l.name);
  colour = {}; [...people.keys()].sort().forEach((u, i) => colour[u] = COLOURS[i % COLOURS.length]);
  const sp = $("speaker"); sp.replaceChildren();
  sp.append(Object.assign(el("option", "", "Everyone"), { value: "" }));
  for (const [u, n] of [...people].sort((a, b) => a[1].localeCompare(b[1]))) sp.append(Object.assign(el("option", "", n), { value: u }));
  draw();
}

// ---- the list ----
function draw() {
  const who = $("speaker").value, show = $("show").value, forbot = $("forbot").checked;
  const words = tidy($("search").value).toLowerCase();
  const plain = !who && !words && show === "all" && !forbot;
  view = [];
  S.lines.forEach((l, i) => {
    if (l.bot) { if (plain) view.push(i); return; }
    const c = S.corrections[l.clip];
    if (who && l.user_id !== who) return;
    if (forbot && !(l.named || l.for_bot)) return;
    if (show === "likely" && (c || l.flag !== "likely")) return;
    if (show === "flag" && (c || !l.flag)) return;
    if (show === "todo" && c) return;
    if (show === "done" && !c) return;
    if (show === "fixed" && !(c && c.status === "fixed")) return;
    if (words && !(l.text + " " + (c && c.text || "") + " " + (l.opinions || []).map(o => o.text).join(" ")).toLowerCase().includes(words)) return;
    view.push(i);
  });
  if ($("order").value === "new") view.reverse();
  list.replaceChildren(); drawn = 0;
  if (!view.length) { const e = el("div", "", "Nothing matches."); e.id = "empty"; list.append(e); }
  more(); counts();
  list.scrollTop = 0;
  if (scrollY > list.offsetTop) scrollTo(0, list.offsetTop);
}
function more() {
  const upto = Math.min(drawn + CHUNK, view.length), added = [];
  for (; drawn < upto; drawn++) { const r = row(view[drawn]); list.append(r); added.push(r); }
  for (const r of added) { const t = r.querySelector("textarea"); if (t) fit(t); }
}
const nearEnd = () => list.scrollHeight > list.clientHeight
  ? list.scrollTop + list.clientHeight > list.scrollHeight - 1200
  : scrollY + innerHeight > document.documentElement.scrollHeight - 1200;
addEventListener("scroll", () => { if (S && drawn < view.length && nearEnd()) more(); }, { passive: true });
list.addEventListener("scroll", () => {
  if (S && drawn < view.length && list.scrollTop + list.clientHeight > list.scrollHeight - 1200) more();
});

function row(i) {
  const l = S.lines[i], r = el("div", "row");
  r.dataset.i = i;
  r.append(el("span", "time", l.time.slice(11, 19)));
  if (l.bot) {
    r.classList.add("bot");
    r.append(el("span", "who", "Gunnabot"), el("div", "said", l.text), el("span"), el("span"));
    return r;
  }
  const who = el("span", "who", l.name); who.style.color = colour[l.user_id]; who.title = l.name;
  const said = el("div", "said"), t = el("textarea"); t.rows = 1; t.spellcheck = true; t.enterKeyHint = "next";
  said.append(t, el("div", "was"));
  if (l.flag) {
    // what the cloud models heard, with the words the bot's model didn't have picked out
    r.classList.add(l.flag);
    const had = new Set(plain(l.text));
    const shown = l.flag === "likely" ? [{ label: "2 models agree", text: l.opinions[0].text }]
      : l.opinions.map(o => ({ label: o.model.split("/").pop().split("-")[0], text: o.text }));
    for (const o of shown) {
      const ref = el("div", "ref"), text = el("span");
      for (const w of o.text.split(/\s+/).filter(Boolean)) {
        const bare = plain(w)[0];
        text.append(bare && !had.has(bare) ? el("mark", "", w) : w, " ");
      }
      if (!o.text) text.append("(heard nothing)");
      const label = el("b", "", o.label); label.title = l.opinions.map(x => x.model).join(", ");
      ref.append(label, text);
      if (o.text) { const use = el("button", "use", "Use"); use.type = "button"; use.tabIndex = -1; use.dataset.text = o.text; use.title = "Put this in the box"; ref.append(use); }
      said.append(ref);
    }
  }
  const tags = el("span", "tags");
  tags.append(el("span", "", (l.audio_ms / 1000).toFixed(1) + "s"));
  if (l.for_bot) { const a = l.outcome + (l.args ? ": " + l.args : ""); const g = el("span", "tag cmd", a); g.title = a; tags.append(g); }
  else if (l.named) tags.append(el("span", "tag", "named"));
  const acts = el("span", "acts");
  for (const [cls, text, title] of [["play", "▶", "Play"], ["save", "✓", "Save and go to the next line"], ["junkb", "Junk", "Not worth learning from"], ["undo", "Undo", "Take the review back"]]) {
    const b = el("button", cls, text); b.title = title; b.tabIndex = -1; b.type = "button"; acts.append(b);
  }
  r.append(who, said, tags, acts);
  paint(r);
  return r;
}
// shows a row as its review stands
function paint(r) {
  const l = S.lines[r.dataset.i], c = S.corrections[l.clip], t = r.querySelector("textarea"), was = r.querySelector(".was");
  r.classList.remove("fixed", "ok", "junk", "dirty");
  if (c) r.classList.add(c.status);
  t.value = c && c.status === "fixed" ? c.text : l.text;
  was.replaceChildren();
  if (c && c.status === "fixed") was.append("heard: ", el("s", "", l.text));
  if (t.isConnected) fit(t);
}
const kept = r => { const l = S.lines[r.dataset.i], c = S.corrections[l.clip]; return c && c.status === "fixed" ? c.text : l.text; };

function counts() {
  let total = 0, done = 0, fixed = 0, likely = 0, unsure = 0;
  for (const l of S.lines) if (!l.bot) {
    total++; const c = S.corrections[l.clip];
    if (c) { done++; if (c.status === "fixed") fixed++; } else if (l.flag === "likely") likely++; else if (l.flag) unsure++;
  }
  const lines = view.filter(i => !S.lines[i].bot).length;
  $("count").textContent = `${lines} shown · ${done} of ${total} reviewed · ${fixed} fixed`
    + (S.reference.length ? ` · ${likely} likely errors and ${unsure} unsure left` : " · no second opinion yet");
  $("count").title = S.reference.length ? "Second opinions from " + S.reference.join(" and ") : "Run reference.py on this session to flag likely errors";
  $("bar").firstChild.style.width = (total ? 100 * done / total : 0) + "%";
}

// ---- playing ----
function play(r) {
  const l = S.lines[r.dataset.i];
  audio.src = "/clip/" + encodeURIComponent(S.id) + "/" + encodeURIComponent(l.clip.slice(6));
  audio.playbackRate = +$("speed").value;
  audio.play().catch(() => {});
}
function current(r) {
  for (const c of list.querySelectorAll(".current")) c.classList.remove("current");
  r.classList.add("current");
}

// ---- saving ----
async function save(r, status) {
  const l = S.lines[r.dataset.i], t = r.querySelector("textarea");
  let text = tidy(t.value);
  if (status === "fixed" && !text) status = "junk";
  try {
    const got = await api("/api/session/" + encodeURIComponent(S.id), { clip: l.clip, status, text });
    if (got.correction) S.corrections[l.clip] = got.correction; else delete S.corrections[l.clip];
    paint(r); counts();
  } catch (e) { r.classList.add("dirty"); toast("Not saved: " + e.message); }
}
function useRef(r, text) {
  const l = S.lines[r.dataset.i], t = r.querySelector("textarea");
  text = text || ((l.opinions || []).find(o => o.text) || {}).text;
  if (!text) return;
  t.value = text; fit(t); r.classList.toggle("dirty", tidy(t.value) !== kept(r)); t.focus();
}
function next(r, back) {
  let n = r;
  do { n = back ? n.previousElementSibling : n.nextElementSibling; if (!n && !back && drawn < view.length) { more(); n = r.nextElementSibling; } }
  while (n && !n.querySelector("textarea"));
  if (n) { const t = n.querySelector("textarea"); t.focus(); t.setSelectionRange(t.value.length, t.value.length); n.scrollIntoView({ block: "center", behavior: "smooth" }); }
}

list.addEventListener("focusin", e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const r = e.target.closest(".row"); current(r);
  if ($("autoplay").checked) play(r);
});
list.addEventListener("focusout", e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const r = e.target.closest(".row");
  // an edit left behind is kept, not lost
  if (r.isConnected && tidy(e.target.value) !== kept(r) && !r.dataset.saving) save(r, "fixed");
});
list.addEventListener("input", e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const r = e.target.closest(".row"); fit(e.target);
  r.classList.toggle("dirty", tidy(e.target.value) !== kept(r));
});
list.addEventListener("keydown", async e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const r = e.target.closest(".row");
  const mark = async status => {
    e.preventDefault();
    r.dataset.saving = 1;
    const going = save(r, status);
    next(r);
    await going; delete r.dataset.saving;
  };
  if (e.key === "Enter" && !e.shiftKey) await mark("fixed");
  else if (e.altKey && e.key.toLowerCase() === "j") await mark("junk");
  else if (e.altKey && e.key.toLowerCase() === "u") { e.preventDefault(); useRef(r); }
  else if (e.ctrlKey && e.code === "Space") { e.preventDefault(); play(r); }
  else if (e.key === "Escape") { e.preventDefault(); e.target.value = kept(r); r.classList.remove("dirty"); fit(e.target); }
  else if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); next(r); }
  else if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); next(r, true); }
});
list.addEventListener("click", e => {
  const r = e.target.closest(".row"); if (!r || r.classList.contains("bot")) return;
  if (e.target.classList.contains("play")) { current(r); play(r); }
  else if (e.target.classList.contains("use")) useRef(r, e.target.dataset.text);
  else if (e.target.classList.contains("save")) { r.dataset.saving = 1; save(r, "fixed").finally(() => delete r.dataset.saving); next(r); }
  else if (e.target.classList.contains("junkb")) save(r, "junk");
  else if (e.target.classList.contains("undo")) save(r, null);
});
// a tap on a button leaves the line being typed in focused, so the keyboard stays up and the edit isn't saved twice
list.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });

// ---- controls ----
$("show").value = prefs.show || "all";
$("forbot").checked = !!prefs.forbot;
$("autoplay").checked = prefs.autoplay !== false;
$("speed").value = prefs.speed || "1";
$("order").value = prefs.order || "old";
$("session").addEventListener("change", e => openSession(e.target.value).catch(err => toast(err.message)));
for (const id of ["speaker", "show", "forbot", "order"]) $(id).addEventListener("change", () => { savePrefs(); draw(); });
for (const id of ["autoplay", "speed"]) $(id).addEventListener("change", savePrefs);
let typing; $("search").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(draw, 200); });
loadSessions().catch(e => { $("empty").textContent = "Could not load: " + e.message; });
</script>
</body>
</html>
