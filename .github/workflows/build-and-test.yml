name: Build, test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: mvn --batch-mode verify

  deploy:
    name: Deploy to homelab
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, musicbot]
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      # the dashboard (dashboard/) runs on the host as a user service, apart from the bot
      - name: Update the dashboard
        run: |
          # jobs don't get the runner's session, which systemctl --user needs
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          mkdir -p ~/gunnabot-dashboard ~/.config/systemd/user
          rsync -a --delete --exclude bench/ --exclude __pycache__/ dashboard/ ~/gunnabot-dashboard/
          install -m 644 dashboard/gunnabot-dashboard.service ~/.config/systemd/user/gunnabot-dashboard.service
          systemctl --user daemon-reload
          systemctl --user enable --quiet gunnabot-dashboard
          systemctl --user restart gunnabot-dashboard
          sleep 2
          systemctl --user is-active gunnabot-dashboard
      - name: Build image and replace the container
        run: |
          echo "STARTED_BEFORE=$(docker inspect -f '{{.State.StartedAt}}' musicbot 2>/dev/null)" >> "$GITHUB_ENV"
          docker compose up --detach --build --remove-orphans
      - name: Wait for the bot to log in
        run: |
          # a change that leaves the image as it was (docs, transcripts/) doesn't restart the bot
          if [ "$(docker inspect -f '{{.State.Running}} {{.State.StartedAt}}' musicbot)" = "true $STARTED_BEFORE" ]; then
            echo "The bot's image didn't change, so it is still running from before"; exit 0
          fi
          for i in $(seq 1 24); do
            if docker logs --since 3m musicbot 2>&1 | grep -q "Finished Loading"; then
              echo "Bot is up"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' musicbot)" != "true" ]; then
              break
            fi
            sleep 5
          done
          echo "Bot did not finish loading:"; docker logs --tail 50 musicbot; exit 1
      - name: Remove dangling images
        run: docker image prune --force
